namespace = global\YukiQoL

[Constants]

global $enabled = 1


[Present]

if $enabled
    run = CustomShaderYukiQoL_DebugRect
    run = CustomShaderYukiQoL_DebugImage
endif


[CustomShaderYukiQoL_DebugRect]

vs = ShaderFixes/YukiQoL_DebugRect_vs.hlsl
ps = ShaderFixes/YukiQoL_DebugRect_ps.hlsl

draw = 6, 0


[CustomShaderYukiQoL_DebugImage]

vs = ShaderFixes/YukiQoL_DebugImage_vs.hlsl
ps = ShaderFixes/YukiQoL_DebugImage_ps.hlsl

ps-t100 = ResourceYukiQoL_DebugTexture

draw = 6, 0


[ResourceYukiQoL_DebugTexture]

filename = Textures/debug_test.dds